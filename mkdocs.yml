site_name: MEIZZO Documentation
site_description: User and developer documentation for the MEIZZO device-assistance ecosystem
site_url: https://rakhan17.github.io/Meizzo/
repo_url: https://github.com/rakhan17/Meizzo
repo_name: rakhan17/Meizzo
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Use light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
nav:
  - MEIZZO Documentation: index.md
  - Getting Started:
      - Quick start: getting-started.md
      - Installation: installation.md
  - User Guide:
      - User manual: user-guide.md
      - Client: client-guide.md
      - Controller: controller-guide.md
      - Pairing: pairing.md
      - Device monitoring: device-monitoring.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Platform Guides:
      - Android: android-guide.md
      - BlueStacks Air: bluestacks-air.md
      - iOS: ios-guide.md
      - iOS implementation status: ios.md
  - Developer Guide:
      - Development setup: development.md
      - Architecture: architecture.md
      - API reference: api-reference.md
      - Backend deployment: backend-deployment.md
      - Cloudflare TURN setup: cloudflare-turn-setup.md
      - Testing: testing.md
      - Security and privacy: security-and-privacy.md
      - V3 development: v3/README.md
      - Upstream references and licenses: v3/UPSTREAM_AND_LICENSES.md
  - Project:
      - Implementation status: implementation-status.md
      - Release notes: release-notes.md
      - Detailed update log: updates.md
      - License status: license.md
      - Contributing: contributing.md
      - Security policy: security-policy.md
      - Pairing protocol: pairing-protocol.md
      - Screenshot contribution: assets/screenshots/README.md
  - V2 Architecture:
      - Audit: v2/architecture-audit.md
      - Architecture: v2/architecture.md
      - Security model: v2/security-model.md
      - Android permissions: v2/android-permissions.md
      - Standard Mode: v2/standard-mode.md
      - Managed Mode: v2/managed-mode.md
      - Networking: v2/networking.md
      - Deployment: v2/deployment.md
      - Testing: v2/testing.md
      - Migration: v2/migration.md
extra:
  generator: false
