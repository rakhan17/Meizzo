site_name: MEIZZO Documentation
site_description: User and developer documentation for the MEIZZO device-assistance ecosystem
site_url: https://rakhan17.github.io/Meizzo/
repo_url: https://github.com/rakhan17/Meizzo
repo_name: rakhan17/Meizzo
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Use light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Inter
    code: JetBrains Mono
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Overview: index.md
  - Getting Started:
      - Quick start: getting-started.md
      - Installation: installation.md
  - User Guide:
      - User manual: user-guide.md
      - Client: client-guide.md
      - Controller: controller-guide.md
      - Pairing: pairing.md
      - Device monitoring: device-monitoring.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
  - Platform Guides:
      - Android: android-guide.md
      - BlueStacks Air: bluestacks-air.md
      - iOS: ios-guide.md
      - iOS implementation status: ios.md
  - Developer Guide:
      - Development setup: development.md
      - Architecture: architecture.md
      - API reference: api-reference.md
      - Backend deployment: backend-deployment.md
      - Testing: testing.md
      - Security and privacy: security-and-privacy.md
  - Project:
      - Implementation status: implementation-status.md
      - Release notes: release-notes.md
      - License status: license.md
      - Contributing: contributing.md
      - Security policy: security-policy.md
      - Pairing protocol: pairing-protocol.md
      - Screenshot contribution: assets/screenshots/README.md
      - Code of Conduct: ../CODE_OF_CONDUCT.md
      - Contributing policy: ../CONTRIBUTING.md
      - Security policy: ../SECURITY.md
      - Support: ../SUPPORT.md
extra:
  generator: false
