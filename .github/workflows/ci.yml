name: MEIZZO CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      debug_signaling_url:
        description: "Debug WebSocket URL for a manually generated Android artifact"
        required: false
        default: "wss://meizzo-signaling.rakhanatanox.workers.dev"
        type: string

permissions:
  contents: read

concurrency:
  group: meizzo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdesk-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned RustDesk source and license
        run: |
          expected="95cca3f661f635b3cc85c04935fe8d96d8f432ef"
          actual="$(git -C third_party/rustdesk rev-parse HEAD)"
          test "$actual" = "$expected"
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" third_party/rustdesk/LICENCE
          cmp -s LICENSE-AGPL-3.0-only third_party/rustdesk/LICENCE
  signaling:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/signaling } }
    steps:
      - uses: actions/checkout@v4
      - name: Test release version derivation
        run: python3 ../../tests/test_release_version.py -v
      - name: Test Android alarm command contract
        run: python3 ../../tests/test_android_alarm_contract.py -v
      - name: Test Android media resilience contract
        run: python3 ../../tests/test_android_media_resilience_contract.py -v
      - name: Test Android glass backdrop regression contract
        run: python3 ../../tests/test_android_glass_backdrop_contract.py -v
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/signaling/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { module: ["client", "controller"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android 17 preview SDK required by Backdrop 2.0.1
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - run: ./gradlew -Pmeizzo.debugSignalingUrl="${{ inputs.debug_signaling_url || 'wss://meizzo-signaling.rakhanatanox.workers.dev' }}" :apps:${{ matrix.module }}:assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android-launch-smoke.sh debug "${{ matrix.module }}"

      - run: |
          mkdir -p dist
          if [ "${{ matrix.module }}" = "client" ]; then
            apk="apps/client/build/outputs/apk/debug/client-debug.apk"
            expected="com.meizzo.client"
            output="dist/MEIZZO-Client.apk"
          else
            apk="apps/controller/build/outputs/apk/debug/controller-debug.apk"
            expected="com.meizzo.controller"
            output="dist/MEIZZO-Controller.apk"
          fi
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "package: name='${expected}'"
          cp "$apk" "$output"
      - uses: actions/upload-artifact@v4
        with:
          name: meizzo-${{ matrix.module }}-debug
          path: dist/*.apk
