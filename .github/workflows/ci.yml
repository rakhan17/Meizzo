name: MEIZZO CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  signaling:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/signaling } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: services/signaling/package-lock.json }
      - run: npm ci
      - run: npm run check
      - run: npm test

  android:
    runs-on: ubuntu-latest
    strategy:
      matrix: { module: ["client", "controller"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :apps:${{ matrix.module }}:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meizzo-${{ matrix.module }}-debug
          path: apps/${{ matrix.module }}/build/outputs/apk/debug/*.apk
