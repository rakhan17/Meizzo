name: MEIZZO Cloudflare Worker

on:
  push:
    branches: [main, develop/v3]
    paths:
      - "wrangler.toml"
      - "services/signaling/cloudflare/**"
      - ".github/workflows/meizzo-cloudflare.yml"
  pull_request:
    paths:
      - "wrangler.toml"
      - "services/signaling/cloudflare/**"
      - ".github/workflows/meizzo-cloudflare.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the existing meizzo-signaling Worker after validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate stable Worker bundle with Wrangler
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.toml

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy existing MEIZZO signaling Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository/environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret"; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Verify deployed Worker health
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error https://meizzo-signaling.rakhanatanox.workers.dev/healthz; then
              exit 0
            fi
            sleep 3
          done
          echo "Worker health check failed after deployment"
          exit 1
