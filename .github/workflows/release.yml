name: MEIZZO Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          for name in MEIZZO_ANDROID_KEYSTORE_BASE64 MEIZZO_ANDROID_KEYSTORE_PASSWORD MEIZZO_ANDROID_KEY_ALIAS MEIZZO_ANDROID_KEY_PASSWORD MEIZZO_SIGNALING_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured before publishing an Android release."
              exit 1
            fi
          done
          case "$MEIZZO_SIGNALING_URL" in
            wss://*) ;;
            *) echo "::error::MEIZZO_SIGNALING_URL must use wss:// for release builds."; exit 1 ;;
          esac
          ./gradlew -Pmeizzo.releaseSignalingUrl="$MEIZZO_SIGNALING_URL" \
            :apps:client:assembleRelease :apps:controller:assembleRelease
      - run: |
          mkdir -p dist
          printf '%s' "$MEIZZO_ANDROID_KEYSTORE_BASE64" | base64 --decode > dist/meizzo-release.jks
          client_apk="$(find apps/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          controller_apk="$(find apps/controller/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$client_apk"
          test -n "$controller_apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks dist/meizzo-release.jks --ks-pass env:MEIZZO_ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$MEIZZO_ANDROID_KEY_ALIAS" --key-pass env:MEIZZO_ANDROID_KEY_PASSWORD "$client_apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks dist/meizzo-release.jks --ks-pass env:MEIZZO_ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$MEIZZO_ANDROID_KEY_ALIAS" --key-pass env:MEIZZO_ANDROID_KEY_PASSWORD "$controller_apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$client_apk"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$controller_apk"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$client_apk" | grep -q "package: name='com.meizzo.client'"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$controller_apk" | grep -q "package: name='com.meizzo.controller'"
          cp "$client_apk" "dist/MEIZZO-Client-${GITHUB_REF_NAME}.apk"
          cp "$controller_apk" "dist/MEIZZO-Controller-${GITHUB_REF_NAME}.apk"
          cp "$client_apk" dist/MEIZZO-Client.apk
          cp "$controller_apk" dist/MEIZZO-Controller.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          rm -f dist/meizzo-release.jks
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
    env:
      MEIZZO_ANDROID_KEYSTORE_BASE64: ${{ secrets.MEIZZO_ANDROID_KEYSTORE_BASE64 }}
      MEIZZO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MEIZZO_ANDROID_KEYSTORE_PASSWORD }}
      MEIZZO_ANDROID_KEY_ALIAS: ${{ secrets.MEIZZO_ANDROID_KEY_ALIAS }}
      MEIZZO_ANDROID_KEY_PASSWORD: ${{ secrets.MEIZZO_ANDROID_KEY_PASSWORD }}
      MEIZZO_SIGNALING_URL: ${{ secrets.MEIZZO_SIGNALING_URL }}
