name: MEIZZO iOS

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        app: [client, controller]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/${{ matrix.app == 'client' && 'Client' || 'Controller' }}
        run: xcodegen generate
      - name: Build simulator app
        working-directory: ios/${{ matrix.app == 'client' && 'Client' || 'Controller' }}
        run: |
          scheme="${{ matrix.app == 'client' && 'MEIZZOClient' || 'MEIZZOController' }}"
          xcodebuild -project "${scheme}.xcodeproj" -scheme "$scheme" \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator build
        working-directory: ios/${{ matrix.app == 'client' && 'Client' || 'Controller' }}
        run: |
          scheme="${{ matrix.app == 'client' && 'MEIZZOClient' || 'MEIZZOController' }}"
          app_path="$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "MEIZZO-${{ matrix.app }}-iOS-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: meizzo-${{ matrix.app }}-ios-simulator
          path: ios/${{ matrix.app == 'client' && 'Client' || 'Controller' }}/MEIZZO-${{ matrix.app }}-iOS-simulator.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meizzo-*-ios-simulator
          path: ios-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ios-artifacts/*.zip
