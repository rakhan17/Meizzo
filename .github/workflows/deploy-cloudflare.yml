name: Deploy MEIZZO Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIME_TURN_TOKEN_ID: ${{ secrets.REALTIME_TURN_TOKEN_ID }}
          REALTIME_TURN_TOKEN_SECRET: ${{ secrets.REALTIME_TURN_TOKEN_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if [ -n "$REALTIME_TURN_TOKEN_ID" ] && [ -z "$REALTIME_TURN_TOKEN_SECRET" ]; then
            echo "REALTIME_TURN_TOKEN_SECRET is missing"
            exit 1
          fi
          if [ -z "$REALTIME_TURN_TOKEN_ID" ] && [ -n "$REALTIME_TURN_TOKEN_SECRET" ]; then
            echo "REALTIME_TURN_TOKEN_ID is missing"
            exit 1
          fi

      - name: Configure optional TURN credentials
        if: ${{ secrets.REALTIME_TURN_TOKEN_ID != '' && secrets.REALTIME_TURN_TOKEN_SECRET != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALTIME_TURN_TOKEN_ID: ${{ secrets.REALTIME_TURN_TOKEN_ID }}
          REALTIME_TURN_TOKEN_SECRET: ${{ secrets.REALTIME_TURN_TOKEN_SECRET }}
        run: |
          printf '%s' "$REALTIME_TURN_TOKEN_ID" | npx --yes wrangler@4 secret put REALTIME_TURN_TOKEN_ID --config wrangler.toml
          printf '%s' "$REALTIME_TURN_TOKEN_SECRET" | npx --yes wrangler@4 secret put REALTIME_TURN_TOKEN_SECRET --config wrangler.toml

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
