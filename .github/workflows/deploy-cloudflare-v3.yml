name: MEIZZO v3 Cloudflare Deployment

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Deploy the develop/v3 signaling Worker to Cloudflare"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate signaling implementation
        working-directory: services/signaling
        run: |
          npm ci
          npm run check
          npm test
      - name: Validate v3 Worker configuration
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.v3.toml
      - name: Deploy v3 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.v3.toml
